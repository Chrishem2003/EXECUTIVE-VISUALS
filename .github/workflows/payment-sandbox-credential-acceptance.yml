name: Payment provider sandbox credential acceptance
on:
  pull_request:
    paths:
      - "scripts/verify-payment-sandbox-credentials.mjs"
      - ".github/workflows/payment-sandbox-credential-acceptance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
      - run: node --check scripts/verify-payment-sandbox-credentials.mjs
  sandbox-credentials:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
      - name: Verify Paddle and Pesapal sandbox credentials without creating charges
        env:
          PADDLE_SANDBOX_API_KEY: ${{ secrets.PADDLE_SANDBOX_API_KEY }}
          PESAPAL_SANDBOX_CONSUMER_KEY: ${{ secrets.PESAPAL_SANDBOX_CONSUMER_KEY }}
          PESAPAL_SANDBOX_CONSUMER_SECRET: ${{ secrets.PESAPAL_SANDBOX_CONSUMER_SECRET }}
        run: node scripts/verify-payment-sandbox-credentials.mjs
