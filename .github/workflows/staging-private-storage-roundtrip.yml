name: Staging private storage round-trip acceptance
on:
  pull_request:
    paths:
      - "scripts/verify-staging-private-storage-roundtrip.mjs"
      - "server/tests/staging-private-storage-roundtrip.test.mjs"
      - ".github/workflows/staging-private-storage-roundtrip.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: executive-visuals-staging-private-storage-acceptance
  cancel-in-progress: false
jobs:
  static-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --check scripts/verify-staging-private-storage-roundtrip.mjs
      - run: node --test server/tests/staging-private-storage-roundtrip.test.mjs
  private-storage-roundtrip:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'Chrishem2003' && vars.STAGING_RUNTIME_TESTS_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run owner-approved private storage round-trip
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          SUPABASE_STAGING_SECRET_KEY: ${{ secrets.SUPABASE_STAGING_SECRET_KEY }}
          STORAGE_TEST_OWNER_EMAIL: ${{ secrets.STORAGE_TEST_OWNER_EMAIL }}
          STORAGE_TEST_OWNER_PASSWORD: ${{ secrets.STORAGE_TEST_OWNER_PASSWORD }}
          STORAGE_TEST_OTHER_EMAIL: ${{ secrets.STORAGE_TEST_OTHER_EMAIL }}
          STORAGE_TEST_OTHER_PASSWORD: ${{ secrets.STORAGE_TEST_OTHER_PASSWORD }}
          STORAGE_TEST_OWNER_ID: ${{ vars.STORAGE_TEST_OWNER_ID }}
          SUPABASE_STAGING_BUCKET: ${{ vars.SUPABASE_STAGING_BUCKET }}
        run: node scripts/verify-staging-private-storage-roundtrip.mjs
