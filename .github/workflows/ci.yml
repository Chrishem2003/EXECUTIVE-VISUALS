name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Ensure media test tools are available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! fc-match "DejaVu Sans" >/dev/null 2>&1 || ! command -v unzip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-dejavu-core unzip
          fi
          ffmpeg -version
          fc-match "DejaVu Sans"
      - name: Install checksum-pinned CAI Node native binary
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/c2pa-node_x86_64-unknown-linux-gnu-v0.10.0.zip"
          url="https://api.github.com/repos/contentauth/c2pa-js/releases/assets/711148157"
          expected="4da99fadf6caef86c9cc4a3ee3e126672c19e4f0dba2e2a0f81d4e0cfc691cfa"
          mkdir -p "$RUNNER_TEMP/c2pa"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 -H "Accept: application/octet-stream" "$url" --output "$archive"
          echo "$expected  $archive" | sha256sum --check -
          entry="$(unzip -Z1 "$archive" | sed -n '1p')"
          test -n "$entry"
          unzip -p "$archive" "$entry" > "$RUNNER_TEMP/c2pa/index.node"
          test -s "$RUNNER_TEMP/c2pa/index.node"
          echo "C2PA_LIBRARY_PATH=$RUNNER_TEMP/c2pa/index.node" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Build and inspect production Docker image
        run: |
          docker build --pull -t executive-visuals-ci .
          docker run --rm --entrypoint sh executive-visuals-ci -c 'test -s "$C2PA_LIBRARY_PATH" && test ! -d /app/server/tests'

  asset-publication-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: executive_visuals_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d executive_visuals_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/executive_visuals_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Bootstrap disposable Supabase-compatible schema
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/asset-publication-postgres-bootstrap.sql
      - name: Apply durable storage cleanup outbox migration
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261106190000_asset_storage_cleanup_outbox.sql
      - name: Verify storage cleanup outbox permissions and path constraints
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/asset-storage-cleanup-postgres-integration.sql
      - name: Apply asset publication ledger migration
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261106230000_asset_publication_ledger.sql
      - name: Verify publication ledger permissions, replay, conflicts and completion
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/asset-publication-postgres-integration.sql
