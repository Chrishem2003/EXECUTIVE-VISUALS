name: Quality checks
on:
  push:
    branches: [main, feat/atomic-asset-publication-pr]
  pull_request:
    branches: [main, feat/idempotent-asset-publication-ledger, feat/lease-fencing-tokens-v2, feat/immutable-asset-publication, feat/durable-publication-cleanup]
  workflow_dispatch:
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: executive_visuals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d executive_visuals_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure media test tools are available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! fc-match "DejaVu Sans" >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
          ffmpeg -version
          fc-match "DejaVu Sans"
      - run: npm install
      - name: Run PostgreSQL migration integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          npm run test:postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/executive_visuals_test
      - run: npm run typecheck
      - run: npm run build
