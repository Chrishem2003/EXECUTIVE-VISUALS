name: Neon private storage round-trip acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neon-storage-roundtrip:
    name: Verify isolated Neon private storage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    env:
      NEON_STORAGE_ENDPOINT: ${{ secrets.NEON_STORAGE_ENDPOINT }}
      NEON_STORAGE_REGION: ${{ vars.NEON_STORAGE_REGION }}
      NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEON_STORAGE_ACCESS_KEY_ID }}
      NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NEON_STORAGE_SECRET_ACCESS_KEY }}
      NEON_STORAGE_BUCKET: ${{ vars.NEON_STORAGE_BUCKET }}
    steps:
      - name: Check out selected staging branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Run isolated storage round-trip
        run: npm run accept:neon-storage-roundtrip
