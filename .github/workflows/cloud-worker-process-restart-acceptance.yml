name: Cloud worker process restart acceptance
on:
  pull_request:
    paths:
      - "scripts/verify-cloud-worker-heartbeat-process.mjs"
      - ".github/workflows/cloud-worker-process-restart-acceptance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
      - run: node --check scripts/verify-cloud-worker-heartbeat-process.mjs
  staging-restart:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'Chrishem2003')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
      - name: Exercise heartbeat persistence across process death and restart
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_STAGING_SECRET_KEY }}
        run: node scripts/verify-cloud-worker-heartbeat-process.mjs
