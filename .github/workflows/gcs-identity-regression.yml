name: GCS identity regression
on:
  push:
    branches:
      - fix/gcs-identity-before-token
  pull_request:
permissions:
  contents: read
concurrency:
  group: gcs-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gcs-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm install
      - name: Verify GCS bootstrap and cloud-worker identity
        run: node --test server/tests/google-gemini-gcs-*.test.mjs server/tests/cloud-worker-process.test.mjs
