name: Encrypted staging backup export
on:
  pull_request:
    paths:
      - "scripts/create-encrypted-staging-backup.mjs"
      - "scripts/verify-encrypted-staging-backup.mjs"
      - "server/tests/encrypted-staging-backup.test.mjs"
      - ".github/workflows/encrypted-staging-backup.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
      - run: node --check scripts/create-encrypted-staging-backup.mjs
      - run: node --check scripts/verify-encrypted-staging-backup.mjs
  encrypted-staging-export:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Export and encrypt staging database and private objects
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_SECRET_KEY: ${{ secrets.SUPABASE_STAGING_SECRET_KEY }}
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
          STAGING_BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.STAGING_BACKUP_ENCRYPTION_PASSPHRASE }}
          STORAGE_BACKUP_BUCKET: executive-visuals-media
        run: node scripts/create-encrypted-staging-backup.mjs
      - name: Decrypt and verify backup archive, database dump and private object checksums
        env:
          STAGING_BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.STAGING_BACKUP_ENCRYPTION_PASSPHRASE }}
          STORAGE_BACKUP_BUCKET: executive-visuals-media
          RESTORE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/restore_test
          RESTORE_OBJECTS_DIR: ${{ runner.temp }}/ev-restored-objects
        run: |
          BACKUP_INPUT_FILE="$(find artifacts -maxdepth 1 -type f -name '*.evb' -print -quit)"
          test -n "$BACKUP_INPUT_FILE"
          BACKUP_INPUT_FILE="$BACKUP_INPUT_FILE" node scripts/verify-encrypted-staging-backup.mjs
      - name: Remove restored plaintext staging data from runner
        if: always()
        run: rm -rf "${{ runner.temp }}/ev-restored-objects"
      - name: Store encrypted artifact temporarily
        uses: actions/upload-artifact@v4
        with:
          name: executive-visuals-encrypted-staging-backup
          path: artifacts/*.evb
          if-no-files-found: error
          retention-days: 7
