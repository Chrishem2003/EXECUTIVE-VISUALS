name: One-time Neon pg lockfile generation

on:
  push:
    branches:
      - feat/neon-postgres-worker-20261119
    paths:
      - "package.json"
      - ".github/workflows/neon-pg-dependency-lock.yml"

permissions:
  contents: write

concurrency:
  group: neon-pg-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
          cache: npm
      - name: Generate lockfile from the reviewed manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(neon): lock PostgreSQL runtime dependency"
          git push origin "HEAD:${BRANCH_NAME}"
