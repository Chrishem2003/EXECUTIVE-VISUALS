name: Remediation workbench checks
on:
  push:
    branches: [ev-release-validation, feat/independent-review-controls-batch-52, feat/secure-evidence-assurance-batch-53, feat/evidence-access-audit-batch-54, feat/reviewer-inbox-sla-batch-55, feat/audit-integrity-export-batch-56, feat/executive-assurance-risk-intelligence-batch-57, feat/verified-assurance-reporting-batch-58, feat/reviewer-performance-intelligence-batch-59]
  pull_request:
    branches: [main, feat/remediation-workbench-batch-51-clean, feat/independent-review-controls-batch-52, feat/secure-evidence-assurance-batch-53, feat/evidence-access-audit-batch-54, feat/reviewer-inbox-sla-batch-55, feat/executive-assurance-risk-intelligence-batch-57, feat/verified-assurance-reporting-batch-58, feat/reviewer-performance-intelligence-batch-59]
concurrency:
  group: remediation-workbench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Install dependencies without native build side effects
        run: npm ci
        env:
          SKIP_RUST_BUILD: "1"
          C2PA_LIBRARY_PATH: ${{ github.workspace }}/node_modules/@contentauth/c2pa-node/dist/index.node
      - name: Verify persistent remediation API and role boundaries
        run: npm run verify:control-remediation-api
      - name: Verify reviewer workload and turnaround analytics
        run: npm run verify:reviewer-performance
      - name: Verify remediation assessment and state transitions
        run: npm run verify:control-remediation
      - name: Check remediation API syntax
        run: node --check server/control-remediation-api.mjs
      - name: Verify portfolio assurance report scope and integrity
        run: npm run verify:finance-assurance-report
      - name: Check assurance report verifier syntax
        run: node --check scripts/verify-finance-assurance-report.mjs
      - name: Verify offline remediation audit export integrity
        run: npm run verify:remediation-audit-export
      - name: Check audit export verifier syntax
        run: node --check scripts/verify-remediation-audit-export.mjs
      - name: Type-check Financial Command Centre integration
        run: npm run typecheck
