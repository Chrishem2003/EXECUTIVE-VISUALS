name: Generate Google Auth dependency lock
on:
  push:
    branches:
      - build/google-auth-lock-2026-11-15
permissions:
  contents: write
concurrency:
  group: google-auth-lockfile
  cancel-in-progress: false
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
      - name: Resolve the Google Auth dependency into the lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit the generated lockfile to this isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "The lockfile is already current."
            exit 0
          fi
          git commit -m "build(gcs): lock Google Auth runtime dependency"
          git push origin "HEAD:${GITHUB_REF_NAME}"
