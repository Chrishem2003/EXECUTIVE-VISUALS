name: Financial intelligence checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/financial-intelligence-api-integration, feat/financial-intelligence-refunds-disputes]
concurrency:
  group: financial-intelligence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  financial-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Install dependencies
        run: npm ci
        env:
          SKIP_RUST_BUILD: "1"
      - name: Check financial modules
        run: |
          node --check server/flutterwave-auth.mjs
          node --check server/payment-intelligence.mjs
          node --check server/financial-intelligence-api.mjs
          node --check server/index.mjs
      - name: Run financial intelligence tests
        run: node --test server/tests/payment-intelligence.test.mjs server/tests/financial-intelligence-api.test.mjs
