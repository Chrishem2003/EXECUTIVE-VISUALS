name: Release integration gate
# This gate is intended to validate the consolidated main-targeting release candidate.

on:
  pull_request:
    branches: [main]
  push:
    branches: [ev-release-validation, main]

permissions:
  contents: read

concurrency:
  group: release-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-build-and-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
      - name: Install locked dependencies
        run: npm ci
        env:
          SKIP_RUST_BUILD: "1"
          C2PA_LIBRARY_PATH: ${{ github.workspace }}/node_modules/@contentauth/c2pa-node/dist/index.node
      - name: Install pinned FFmpeg static build
        shell: bash
        run: bash scripts/ci-setup-ffmpeg.sh
      - name: Verify FFmpeg and FFprobe for media verification
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version
          ffprobe -version
      - name: Run complete product verification and production build
        run: npm run build

  isolated-d1-staging-live-acceptance:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 499 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
      - name: Verify isolated staging and production boundaries
        run: node scripts/verify-d1-staging-live.mjs
