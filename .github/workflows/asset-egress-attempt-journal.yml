name: Asset egress attempt journal
on:
  pull_request:
    paths:
      - "server/asset-egress-attempt-journal.mjs"
      - "server/tests/asset-egress-attempt-journal.test.mjs"
      - "supabase/migrations/*asset_egress_attempt_journal*"
      - ".github/workflows/asset-egress-attempt-journal.yml"
permissions:
  contents: read
jobs:
  journal-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
      - run: node --test server/tests/asset-egress-attempt-journal.test.mjs
