name: Billing self-service quality checks

on:
  push:
    branches:
      - feat/financial-intelligence-api-integration
      - feat/financial-command-centre-batch-12
      - feat/financial-operations-batch-13
      - feat/customer-loyalty-batch-14
      - feat/creator-referrals-batch-15
      - feat/customer-lifetime-intelligence-batch-16
      - feat/subscription-growth-engine-batch-17
      - feat/predictive-revenue-intelligence-batch-18
      - feat/revenue-retention-acquisition-economics-batch-19
      - feat/financial-profitability-unit-economics-batch-20
      - feat/ai-cost-intelligence-margin-optimization-batch-21
      - feat/automated-provider-metering-reconciliation-batch-22
      - feat/render-economics-model-routing-shadow-batch-23
      - feat/render-economics-model-routing-shadow-batch-23-final
      - feat/unified-profitability-margin-protection-batch-24
      - feat/verified-cost-reconciliation-profitability-trends-batch-25
      - feat/measured-shared-cost-allocation-batch-26
  pull_request:

permissions:
  contents: read

concurrency:
  group: billing-self-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  billing-self-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: executive_visuals_billing_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d executive_visuals_billing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BILLING_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/executive_visuals_billing_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Install dependencies without native build side effects
        run: npm ci --ignore-scripts
      - name: Type-check customer billing UI and application
        run: npm run typecheck
      - name: Check financial API syntax
        run: |
          node --check server/index.mjs
          node --check server/financial-intelligence-api.mjs
          node --check server/ai-cost-metering.mjs
          node --check server/ai-resource-economics.mjs
          node --check server/media.mjs
          node --check server/workflow-executor.mjs
          node --check server/flutterwave-auth.mjs
          node --check server/payment-intelligence.mjs
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Bootstrap disposable Supabase-compatible billing schema
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/billing-self-service-postgres-bootstrap.sql
      - name: Apply customer subscription self-service migration
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261110220000_customer_subscription_self_service.sql
      - name: Apply first subscription purchase migration
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261110230000_subscription_purchase_checkout.sql
      - name: Apply lifecycle expiry migration
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261110240000_subscription_lifecycle_expiry.sql
      - name: Apply Batch 12 financial command centre migration
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111090000_financial_command_centre.sql
      - name: Apply Batch 13 dispute evidence migration
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111100000_financial_dispute_evidence.sql
      - name: Apply Creator Momentum loyalty migration
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111110000_creator_momentum_loyalty.sql
      - name: Apply Creator Circle referrals migration
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111120000_creator_circle_referrals.sql
      - name: Apply Customer Lifetime Intelligence migration
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111130000_customer_lifetime_intelligence.sql
      - name: Apply Subscription Growth Engine migration
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111140000_subscription_growth_engine.sql
      - name: Apply Predictive Revenue Intelligence migration
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111150000_predictive_revenue_intelligence.sql
      - name: Apply Revenue Retention & Acquisition Economics migration
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111160000_revenue_retention_acquisition_economics.sql
      - name: Apply Financial Profitability & Unit Economics migration
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111170000_financial_profitability_unit_economics.sql
      - name: Apply AI Cost Intelligence Batch 21 migration
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111180000_ai_cost_intelligence_batch_21.sql
      - name: Apply Automated Provider Metering Batch 22 migration
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111190000_automated_provider_metering_reconciliation_batch_22.sql
      - name: Apply Render Economics & Model Routing Shadow Batch 23 migration
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111200000_render_economics_model_routing_shadow_batch_23.sql
      - name: Apply Unified Profitability & Margin Protection Batch 24 migration
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111210000_unified_profitability_margin_protection_batch_24.sql
      - name: Apply Verified Cost Reconciliation & Profitability Trends Batch 25 migration
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111220000_verified_cost_reconciliation_profitability_trends_batch_25.sql
      - name: Apply Measured Shared-Cost Allocation Batch 26 migration
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111230000_measured_shared_cost_allocation_batch_26.sql
      - name: Verify atomic subscription purchase, plan changes, cancellation and failed checkout
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/billing-self-service-postgres-integration.sql
      - name: Verify resource economics and shadow model routing
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/ai-resource-economics-postgres-integration.sql
      - name: Verify Batch 25 invoice-to-ledger reconciliation and profitability trends
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/verified-cost-reconciliation-postgres-integration.sql
      - name: Verify Batch 26 measured shared-cost allocation and fully loaded profitability
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/measured-shared-cost-allocation-postgres-integration.sql
      - name: Run financial API tests
        run: node --test server/tests/financial-intelligence-api.test.mjs server/tests/financial-command-centre.test.mjs server/tests/ai-cost-metering.test.mjs server/tests/ai-resource-economics.test.mjs
