name: Billing self-service quality checks

on:
  push:
    branches:
      - feat/financial-intelligence-api-integration
      - feat/financial-command-centre-batch-12
      - feat/financial-operations-batch-13
  pull_request:

permissions:
  contents: read

concurrency:
  group: billing-self-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  billing-self-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: executive_visuals_billing_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d executive_visuals_billing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BILLING_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/executive_visuals_billing_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Install dependencies without native build side effects
        run: npm ci --ignore-scripts
      - name: Type-check customer billing UI and application
        run: npm run typecheck
      - name: Check financial API syntax
        run: |
          node --check server/index.mjs
          node --check server/financial-intelligence-api.mjs
          node --check server/flutterwave-auth.mjs
          node --check server/payment-intelligence.mjs
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Bootstrap disposable Supabase-compatible billing schema
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/billing-self-service-postgres-bootstrap.sql
      - name: Apply customer subscription self-service migration
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261110220000_customer_subscription_self_service.sql
      - name: Apply first subscription purchase migration
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261110230000_subscription_purchase_checkout.sql
      - name: Apply lifecycle expiry migration
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261110240000_subscription_lifecycle_expiry.sql
      - name: Apply Batch 12 financial command centre migration
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111090000_financial_command_centre.sql
      - name: Apply Batch 13 dispute evidence migration
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261111100000_financial_dispute_evidence.sql
      - name: Verify atomic subscription purchase, plan changes, cancellation and failed checkout
        run: psql "$BILLING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/billing-self-service-postgres-integration.sql
      - name: Run financial API tests
        run: node --test server/tests/financial-intelligence-api.test.mjs server/tests/financial-command-centre.test.mjs
