name: Staging environment configuration preflight
on:
  push:
    branches:
      - feat/batch-137-staging-preflight-readiness-2026-11-26
    paths:
      - "scripts/check-staging-environment-readiness.mjs"
      - "scripts/check-staging-environment-readiness.test.mjs"
      - "scripts/verify-staging-runtime-readiness.mjs"
      - "scripts/verify-staging-runtime-readiness.test.mjs"
      - ".github/workflows/staging-runtime-readiness.yml"
      - ".github/workflows/staging-environment-preflight.yml"
  pull_request:
    paths:
      - "scripts/check-staging-environment-readiness.mjs"
      - "scripts/check-staging-environment-readiness.test.mjs"
      - "scripts/verify-staging-runtime-readiness.mjs"
      - "scripts/verify-staging-runtime-readiness.test.mjs"
      - ".github/workflows/staging-runtime-readiness.yml"
      - ".github/workflows/staging-environment-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-contract:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
      - run: node --check scripts/check-staging-environment-readiness.mjs
      - run: node --test scripts/check-staging-environment-readiness.test.mjs
      - run: node --check scripts/verify-staging-runtime-readiness.mjs
      - run: node --test scripts/verify-staging-runtime-readiness.test.mjs
  staging-preflight:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'Chrishem2003')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
      - name: Assess staging configuration without printing credentials
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          SUPABASE_STAGING_SECRET_KEY: ${{ secrets.SUPABASE_STAGING_SECRET_KEY }}
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
          STORAGE_TEST_OWNER_JWT: ${{ secrets.STORAGE_TEST_OWNER_JWT }}
          STORAGE_TEST_OTHER_JWT: ${{ secrets.STORAGE_TEST_OTHER_JWT }}
          STORAGE_TEST_OWNER_ID: ${{ vars.STORAGE_TEST_OWNER_ID }}
          STAGING_BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.STAGING_BACKUP_ENCRYPTION_PASSPHRASE }}
          PADDLE_SANDBOX_API_KEY: ${{ secrets.PADDLE_SANDBOX_API_KEY }}
          PADDLE_WEBHOOK_SECRET: ${{ secrets.PADDLE_WEBHOOK_SECRET }}
          PESAPAL_SANDBOX_CONSUMER_KEY: ${{ secrets.PESAPAL_SANDBOX_CONSUMER_KEY }}
          PESAPAL_SANDBOX_CONSUMER_SECRET: ${{ secrets.PESAPAL_SANDBOX_CONSUMER_SECRET }}
          PESAPAL_IPN_ID: ${{ vars.PESAPAL_IPN_ID }}
          PESAPAL_CALLBACK_URL: ${{ vars.PESAPAL_CALLBACK_URL }}
          PADDLE_RETURN_URL: ${{ vars.PADDLE_RETURN_URL }}
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          EXECUTIVE_VISUALS_HEALTH_URL: ${{ vars.EXECUTIVE_VISUALS_HEALTH_URL }}
        run: node scripts/check-staging-environment-readiness.mjs --require-ready
