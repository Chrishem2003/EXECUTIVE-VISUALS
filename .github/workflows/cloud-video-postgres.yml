name: Cloud video PostgreSQL integration
on:
  push:
    branches: ["feat/**"]
  pull_request:
    branches: ["main", "feat/**", "fix/**"]
concurrency:
  group: cloud-video-postgres-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: executive_visuals_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d executive_visuals_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/executive_visuals_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Bootstrap disposable Supabase-compatible schema
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/cloud-video-postgres-bootstrap.sql
      - name: Apply cloud submission ledger migration
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261104120000_cloud_video_submission_ledger.sql
      - name: Apply cloud budget and enqueue migration
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261104143000_cloud_video_budget_enqueue.sql
      - name: Apply Runway PostgreSQL approval bridge migration
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261105160000_runway_router_postgres_approval.sql
      - name: Apply private Google provider-file mapping migration
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261105100000_google_provider_files.sql
      - name: Verify private Google provider-file mapping privileges
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/google-provider-files-postgres-integration.sql
      - name: Apply durable Google provider-file upload-attempt migration
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261105120000_google_provider_file_upload_attempts.sql
      - name: Apply Gemini provider-file recovery lease migration
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261105190000_google_provider_file_recovery_leases.sql
      - name: Verify private Google upload-attempt ledger, quarantine state and recovery lease
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/google-provider-file-upload-attempts-postgres-integration.sql
      - name: Apply durable Google Drive export-attempt migration
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261105170000_google_drive_export_attempts.sql
      - name: Apply Google Drive export lease-integrity migration
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261105180000_google_drive_export_lease_integrity.sql
      - name: Verify private Google Drive export-attempt ledger
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/google-drive-export-attempts-postgres-integration.sql
      - name: Verify Google Drive export lease-integrity constraint and recovery index
        run: |
          test "$(psql "$DATABASE_URL" -X -Atqc "select count(*) from pg_constraint where conname = 'google_drive_export_attempts_lease_pair_check' and conrelid = 'executive_visuals.google_drive_export_attempts'::regclass")" = "1"
          test "$(psql "$DATABASE_URL" -X -Atqc "select count(*) from pg_indexes where schemaname = 'executive_visuals' and indexname = 'google_drive_export_attempts_expired_lease_idx'")" = "1"
      - name: Apply private GCS registration metadata migration
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261105133000_google_gcs_file_registration.sql
      - name: Verify private GCS registration metadata privileges
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/google-gcs-registration-postgres-integration.sql
      - name: Apply durable Google video interaction migration
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261105120000_google_video_interactions.sql
      - name: Verify durable Google interaction ownership and privileges
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/google-video-interactions-postgres-integration.sql
      - name: Verify authorization, atomic enqueue and finalization
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/cloud-video-postgres-integration.sql
      - name: Prepare concurrency test approval
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/cloud-video-postgres-concurrency-approval.sql
      - name: Verify concurrent idempotent enqueue
        run: bash scripts/cloud-video-postgres-concurrency.sh
