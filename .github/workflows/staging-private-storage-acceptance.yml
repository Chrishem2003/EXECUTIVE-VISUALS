name: Staging private asset round-trip acceptance
on:
  pull_request:
    paths:
      - "scripts/verify-private-storage-roundtrip.mjs"
      - ".github/workflows/staging-private-storage-acceptance.yml"
      - "docs/ops/STAGING-PRIVATE-STORAGE-ROUNDTRIP-BATCH-140.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: executive-visuals-staging-private-storage-acceptance
  cancel-in-progress: false
jobs:
  static-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check staging acceptance script syntax
        run: node --check scripts/verify-private-storage-roundtrip.mjs
  private-storage-acceptance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
      SUPABASE_STAGING_SECRET_KEY: ${{ secrets.SUPABASE_STAGING_SECRET_KEY }}
      STORAGE_TEST_OWNER_ID: ${{ secrets.STORAGE_TEST_OWNER_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify private upload, signed download, tenant isolation and cleanup
        run: node scripts/verify-private-storage-roundtrip.mjs
