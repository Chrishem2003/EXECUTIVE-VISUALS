name: Google Drive integration quality
on:
  push:
    branches: [integration/drive-billing-settings-2026]
  pull_request:
    branches: [integration/billing-foundation-current-main]
concurrency:
  group: google-drive-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure media test tools are available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! fc-match "DejaVu Sans" >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
          ffmpeg -version
          fc-match "DejaVu Sans"
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Full quality and regression suite
        run: npm run build
