name: Staging worker liveness acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: executive-visuals-staging-worker-liveness
  cancel-in-progress: false
jobs:
  worker-liveness:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run owner-approved worker crash and graceful-stop acceptance
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_SECRET_KEY: ${{ secrets.SUPABASE_STAGING_SECRET_KEY }}
        run: node scripts/verify-cloud-worker-heartbeat-process.mjs
